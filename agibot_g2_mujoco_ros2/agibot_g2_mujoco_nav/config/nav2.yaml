controller_server:
  ros__parameters:
    controller_frequency: 50.0
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.02
      required_movement_angle: 0.05
      movement_time_allowance: 5.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.03
      stateful: false

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 50
      model_dt: 0.02
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.4
      vy_std: 0.4
      wz_std: 0.8
      vx_max: 1.0
      vx_min: -1.0
      vy_max: 1.0
      wz_max: 2.0
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      prune_distance: 2.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      regenerate_noises: false
      visualize: false
      critics: [ConstraintCritic, GoalCritic, GoalAngleCritic, PathFollowCritic]

      ConstraintCritic:
        cost_weight: 4.0
        cost_power: 1
      GoalCritic:
        cost_weight: 15.0
        cost_power: 1
        threshold_to_consider: 2.0
      GoalAngleCritic:
        cost_weight: 10.0
        cost_power: 1
        threshold_to_consider: 2.0
      PathFollowCritic:
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 6
        threshold_to_consider: 0.8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.2
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [3.0, 3.0, 3.5]
    max_decel: [-3.0, -3.0, -3.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2
    enable_stamped_cmd_vel: false
